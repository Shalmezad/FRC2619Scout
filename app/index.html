<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Charge Scout</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Charge Scout">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="bolt">⚡</span>
      <h1>Charge Scout</h1>
    </div>
    <nav class="tabs" role="tablist">
      <button id="tab-scout" class="tab active" role="tab" aria-selected="true">Scout</button>
      <button id="tab-lead" class="tab" role="tab" aria-selected="false">Lead</button>
    </nav>
    <button id="install-btn" hidden>Install</button>
  </header>

  <main>
    <!-- ==================== SCOUT VIEW ==================== -->
    <section id="view-scout" aria-label="Scout data entry">
      <form id="scout-form" autocomplete="off" novalidate>
        <div class="grid-2">
          <label class="field">
            <span class="field-label">Match #</span>
            <span class="stepper">
              <button type="button" class="step" data-step="-1" data-target="match" aria-label="Fewer">−</button>
              <input id="match" name="match" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" required>
              <button type="button" class="step" data-step="1" data-target="match" aria-label="More">+</button>
            </span>
          </label>
          <label class="field">
            <span class="field-label">Team #</span>
            <span class="stepper">
              <button type="button" class="step" data-step="-1" data-target="team" aria-label="Fewer">−</button>
              <input id="team" name="team" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" required>
              <button type="button" class="step" data-step="1" data-target="team" aria-label="More">+</button>
            </span>
          </label>
        </div>

        <fieldset class="field">
          <legend class="field-label">Position</legend>
          <div class="seg" data-field="pos">
            <button type="button" data-val="R1" class="on">R1</button>
            <button type="button" data-val="R2">R2</button>
            <button type="button" data-val="R3">R3</button>
            <button type="button" data-val="B1">B1</button>
            <button type="button" data-val="B2">B2</button>
            <button type="button" data-val="B3">B3</button>
          </div>
        </fieldset>

        <label class="field">
          <span class="field-label">Balls scored</span>
          <span class="stepper big">
            <button type="button" class="step" data-step="-1" data-target="balls" aria-label="Fewer">−</button>
            <input id="balls" name="balls" type="text" inputmode="numeric" pattern="[0-9]*" value="0">
            <button type="button" class="step" data-step="1" data-target="balls" aria-label="More">+</button>
          </span>
        </label>

        <div class="grid-2">
          <div class="field">
            <span class="field-label">Broke down?</span>
            <div class="seg" data-field="broke">
              <button type="button" data-val="no" class="on">No</button>
              <button type="button" data-val="yes">Yes</button>
            </div>
          </div>
          <div class="field">
            <span class="field-label">Climbed?</span>
            <div class="seg" data-field="climb">
              <button type="button" data-val="no" class="on">No</button>
              <button type="button" data-val="yes">Yes</button>
            </div>
          </div>
        </div>

        <label class="field">
          <span class="field-label">Notes <span class="muted">(optional)</span></span>
          <textarea id="notes" name="notes" rows="2" maxlength="200"
                    placeholder="Defense, driver issues, contact…"></textarea>
        </label>

        <button type="submit" class="primary block">Save &amp; show QR</button>
      </form>

      <!-- QR display -->
      <div id="qr-panel" class="card" hidden>
        <h2>Show this to the lead</h2>
        <canvas id="qr-canvas" width="640" height="640" aria-label="QR code with this record"></canvas>
        <p id="qr-caption" class="muted"></p>
        <button id="qr-close" class="block">Done</button>
      </div>

      <!-- Device history -->
      <section class="history">
        <h2>On this device <span class="muted">(<span id="history-count">0</span>)</span></h2>
        <ul id="history-list" class="records"></ul>
        <p class="muted empty" id="history-empty">Nothing saved yet.</p>
        <div class="btn-row">
          <button id="scout-export-csv">Export CSV</button>
          <button id="scout-export-json">Backup JSON</button>
        </div>
      </section>
    </section>

    <!-- ==================== LEAD VIEW ==================== -->
    <section id="view-lead" hidden aria-label="Scouting lead collection">
      <div class="card scan-card">
        <h2>Scan scouts' QR codes</h2>
        <div id="scanner" hidden>
          <div class="video-wrap">
            <video id="scan-video" playsinline muted autoplay></video>
            <div class="scan-frame" aria-hidden="true"></div>
          </div>
          <p class="muted scan-hint">Point the camera at a scout's screen.</p>
          <button id="scan-stop" class="block">Stop scanning</button>
        </div>
        <button id="scan-start" class="primary block">Start scanning</button>
        <p id="scan-status" class="muted" hidden></p>
      </div>

      <details class="card">
        <summary>Paste QR text manually</summary>
        <textarea id="paste-json" rows="3" placeholder='Paste the QR content here ({"v":1,…})'></textarea>
        <button id="paste-add">Add record</button>
      </details>

      <section class="history">
        <h2>Collected <span class="muted">(<span id="lead-count">0</span>)</span></h2>
        <ul id="lead-list" class="records"></ul>
        <p class="muted empty" id="lead-empty">No records yet — scan one to begin.</p>
        <div class="btn-row">
          <button id="lead-export-csv" class="primary">Export CSV (Excel)</button>
          <button id="lead-export-json">Export JSON</button>
          <button id="lead-clear" class="danger">Clear all</button>
        </div>
      </section>
    </section>
  </main>

  <div id="toast" role="status" hidden></div>

  <script src="vendor/qrcode-generator.js"></script>
  <script src="vendor/jsQR.js"></script>
  <script src="app.js"></script>
</body>
</html>
